name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  harness:
    name: harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      # Kept for the M6/TC gates, which still reach this sibling repo. The old
      # F4 Classic-parity gate used it as its oracle; since 2026-10-17 parity is
      # measured by compare_f4_canonical.py against canonical interpreters instead
      # (engine.zig assigns 0xFFFF at EOF, so it could not falsify the EOF bug).
      - name: Checkout MalbolgeFree
        uses: actions/checkout@v4
        with:
          path: MalbolgeFree

      # compare_f4_canonical.py needs a CANONICAL interpreter (`a = 59048` at
      # w=10). Since 2026-10-17 it ships one inside this repo:
      # vendor/canonical_malbolge_py/malbolge.py, a verbatim copy of
      # github.com/DannyBaanks/MALBOLGE@bf4d6fa (see its PROVENANCE.md), so both
      # runners MEASURE canonical parity instead of skipping it: 10 cases x 2 cores
      # x 1 oracle = 20 stdout-hash comparisons. The copy is pinned by SHA-256, so
      # drift is exit 4 (hard FAIL) and only a missing oracle is exit 3
      # (NOT_DEMONSTRATED skip). Set MALFREE_REFERENCE_CLASSIC or
      # MALFREE_MALBOLGE_REFERENCE to add an external oracle as a second witness.
      # .gitattributes ('* -text') is load-bearing for this gate: windows-latest
      # defaults to core.autocrlf=true, and at 7e6eb5d that re-end-lined the vendored
      # oracle, the pin disagreed, and the job failed with F4C_VENDORED_ORACLE_DRIFT
      # instead of reporting a parity PASS it had not earned (ledger entry 26).
      - name: Checkout Malbolge-Translator (M6/TC oracle)
        uses: actions/checkout@v4
        with:
          repository: DannyBaanks/Malbolge-Translator
          path: Malbolge-Translator

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Zig 0.16.0 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /opt
          # immediate use in THIS step...
          ln -sf /opt/zig-x86_64-linux-0.16.0/zig /usr/local/bin/zig
          # ...and in later steps
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          zig version

      - name: Setup Zig 0.16.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile "$env:TEMP\zig.zip"
          Expand-Archive -Path "$env:TEMP\zig.zip" -DestinationPath "C:\zig" -Force
          $zigDir = "C:\zig\zig-x86_64-windows-0.16.0"
          # immediate use in THIS step...
          $env:PATH = "$zigDir;$env:PATH"
          # ...and in later steps
          Add-Content -Path $env:GITHUB_PATH -Value $zigDir
          zig version

      - name: Run full harness
        working-directory: MalbolgeFree
        shell: bash
        run: |
          set -o pipefail
          python tests/run_all.py 2>&1 | tee ci-harness.log

      - name: Report NOT_DEMONSTRATED gates in the job summary
        if: always()
        working-directory: MalbolgeFree
        shell: bash
        run: |
          {
            echo "### MalbolgeFree CI"
            echo
            echo '```'
            tail -n 40 ci-harness.log || echo "(no log)"
            echo '```'
            grep -E '^NOT_DEMONSTRATED in this' ci-harness.log || true
          } >> "$GITHUB_STEP_SUMMARY"